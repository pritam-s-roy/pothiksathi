name: PothikSathi CI - Android & Backend Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-and-admin:
    name: Backend, Admin Portal & Security Rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            backend/functions/package-lock.json
            admin_web/package-lock.json

      - name: Install & Build Cloud Functions
        working-directory: backend/functions
        run: |
          npm ci
          npm run build

      - name: Install & Build Admin Web Portal
        working-directory: admin_web
        run: |
          npm ci
          npm run build

      - name: Set up Python for Test Suite
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Automated Verification Suite (28 Tests)
        run: python scripts/run_all_tests.py

      - name: Run Static Syntax & Architecture Audit
        run: python scripts/verify_dart_syntax.py

      - name: Run Node.js Integration Audit Harness
        run: node scripts/test_pre_deployment_audit.mjs

  android-build:
    name: Flutter Analysis, Tests & Android APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Generate Clean Android Native Project & Gradle Wrapper
        working-directory: mobile_app
        run: |
          rm -rf android
          flutter create . --platforms=android --org=in.pothiksathi
          rm -f test/widget_test.dart

      - name: Install Flutter Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Analyze Flutter Code
        working-directory: mobile_app
        run: flutter analyze || true

      - name: Run Flutter Tests
        working-directory: mobile_app
        run: flutter test

      - name: Build Android Debug APK
        working-directory: mobile_app
        run: |
          if ! flutter build apk --debug -v > debug_build.log 2>&1; then
            echo "::error title=Gradle Debug Error::$(tail -n 15 debug_build.log)"
            echo "=== GRADLE DEBUG BUILD FAILED (LAST 80 LINES) ==="
            tail -n 80 debug_build.log
            exit 1
          fi

      - name: Build Android Release APK (ABI Split)
        working-directory: mobile_app
        run: |
          if ! flutter build apk --release --split-per-abi -v > release_build.log 2>&1; then
            echo "::error title=Gradle Release Error::$(tail -n 15 release_build.log)"
            echo "=== GRADLE RELEASE BUILD FAILED (LAST 80 LINES) ==="
            tail -n 80 release_build.log
            exit 1
          fi

      - name: Upload Build Log on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-build-log
          path: mobile_app/*_build.log

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pothiksathi-debug-apk
          path: mobile_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn

      - name: Upload Release APKs (arm64 & armeabi)
        uses: actions/upload-artifact@v4
        with:
          name: pothiksathi-release-apks
          path: mobile_app/build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: warn
