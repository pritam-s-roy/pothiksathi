name: pothiksathi
description: "PothikSathi - Lightweight Local Mobility Platform for Karimpur, Nadia, West Bengal"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management - lightweight, zero bloat, low memory overhead
  provider: ^6.1.2
  # Offline persistent storage for cache and preferences
  shared_preferences: ^2.2.3
  # Localization, currency formatting (₹), and date utilities
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
