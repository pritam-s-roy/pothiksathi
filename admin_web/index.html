<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PothikSathi Admin Portal — Karimpur Dispatch & Management</title>
    <style>
      :root {
        --primary: #1b5e20;
        --primary-light: #2e7d32;
        --primary-tint: #e8f5e9;
        --bg: #f8faf8;
        --surface: #ffffff;
        --border: #e0e7e0;
        --text: #1e261e;
        --text-muted: #5e6d5e;
        --status-pending: #ef6c00;
        --status-assigned: #0277bd;
        --status-success: #2e7d32;
        --status-danger: #c62828;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      body {
        background-color: var(--bg);
        color: var(--text);
      }
      button {
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
